# 密钥与敏感信息扫描（plan.md §7.4A、T-O02a）。
# - pull_request：base..head 的每一个提交（不是只看最终 diff，先加后删的也要拦）
# - push：before..after 的每一个提交；新分支或无法定位 before 时扫全部历史
# - schedule：每天对全部历史全量扫描；workflow_dispatch 同样全量
# 工具只用 gitleaks（规则在 .gitleaks.toml）+ scripts/ci/secret_scan.py（同一套 S1–S9，含校验位/夹具豁免/告警级规则）。
# 日志只输出 `路径:行号:规则号` 和掩码值（保留前 2 个字符）；gitleaks 原始 JSON 只写 $RUNNER_TEMP，不上传。
name: secret-scan

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 19 * * *" # 每天 03:17 北京时间
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  UV_VERSION: "0.13.6"
  PYYAML_VERSION: "6.0.3"
  PYTEST_VERSION: "9.2.0"

jobs:
  scan:
    name: gitleaks + secret_scan (S1–S9)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: 安装 gitleaks（校验 sha256）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: 确定扫描范围
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
          esac
          if [ -z "$range" ]; then
            echo "mode=history" >> "$GITHUB_OUTPUT"
            echo "扫描范围：全部历史（git rev-list --all，$(git rev-list --all | wc -l) 个提交）"
          else
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "range=$range" >> "$GITHUB_OUTPUT"
            echo "扫描范围：$range（$(git rev-list "$range" | wc -l) 个提交）"
          fi
      - name: gitleaks（.gitleaks.toml）
        id: gitleaks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          MODE: ${{ steps.range.outputs.mode }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          if [ "$MODE" = history ]; then opts="--all"; else opts="$RANGE"; fi
          "$GITLEAKS_BIN" git . --no-banner -c .gitleaks.toml --ignore-gitleaks-allow \
            --log-opts="$opts" -f json -r "$RUNNER_TEMP/gitleaks.json" --exit-code 0 -l warn
          python3 scripts/ci/gitleaks_report.py "$RUNNER_TEMP/gitleaks.json"
      - name: secret_scan.py（同一套 S1–S9，含告警级规则）
        if: ${{ !cancelled() }}
        shell: bash
        env:
          MODE: ${{ steps.range.outputs.mode }}
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          run() { uv run --no-project -q --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/secret_scan.py "$@"; }
          if [ "$MODE" = history ]; then run history; else run range "$RANGE"; fi
          run tree
      - name: .secretscan-allow.yaml 与 .gitleaks.toml 校验 + 夹具一致性
        if: ${{ !cancelled() }}
        run: uv run --no-project -q --with "pyyaml==${PYYAML_VERSION}" python scripts/ci/check_fixtures.py
      - name: 清理报告
        if: always()
        run: rm -f "$RUNNER_TEMP/gitleaks.json" "$RUNNER_TEMP/gitleaks.tgz"

  # 真实密钥值精确比对：值来自 GitHub secrets（未配置则跳过并提示）；git grep -qF，绝不打印值。
  secret-exact:
    name: secret-exact (real values not in repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # fork 来的 PR 拿不到 secrets，脚本会按“未配置”跳过
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: git grep -qF（工作区 + 全部历史）
        shell: bash
        env:
          MAIRUI_LICENCE: ${{ secrets.MAIRUI_LICENCE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          bash scripts/ci/check_real_secrets.sh worktree
          bash scripts/ci/check_real_secrets.sh history

  # 规则本身的正反例测试（scripts/ci/tests/，反例全部运行时生成假值）
  selftest:
    name: secret-scan rules self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: 安装 gitleaks（校验 sha256）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: pytest scripts/ci/tests
        working-directory: scripts/ci/tests
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: >-
          uv run --no-project -q --with "pyyaml==${PYYAML_VERSION}" --with "pytest==${PYTEST_VERSION}"
          python -m pytest -q -p no:cacheprovider .
