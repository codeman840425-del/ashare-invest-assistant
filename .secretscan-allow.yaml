# 密钥与敏感信息扫描允许清单（plan.md §7.4A；scripts/ci/secret_scan.py 与 .gitleaks.toml 共用）
#
# 规则：
# - 每项必须有 rule、path 或 value_regex、reason、added_by、added_at。
# - value_regex 只能是 ^字面量$ 形式的单个虚构值（脚本强制）；不得放任何真实值或通配。
# - 本文件受 CODEOWNERS 保护：新增或修改须架构师或测试负责人评审。
# - value_regex 项必须与 .gitleaks.toml 的 [[allowlists]] regexes 一一对应
#   （scripts/ci/tests/test_secret_scan.py 校验两边一致）。
# - 夹具豁免：S5/S6 不靠本文件的通配路径，而是由 meta.json 条件 + fake_identifiers 判定；
#   S7 按路径豁免 docs/ 顶层 *.md 与 tests/fixtures/broker_statements/ 整个目录（脚本与 .gitleaks.toml 内置）；
#   origin=desensitized_main 的主样本须在此登记 path + sha256 + reviewer（见文末模板）。
version: 1
entries:
  - rule: S5
    value_regex: '^A000000001$'
    reason: 虚构沪市股东代码（generate.py、plan/契约示例）
    added_by: ops (T-O02a)
    added_at: 2026-11-01
  - rule: S5
    value_regex: '^A000000000$'
    reason: 虚构沪市股东代码（第二个虚构值，账户不一致用例）
    added_by: ops (T-O02a)
    added_at: 2026-11-01
  - rule: S6
    value_regex: '^0000000001$'
    reason: 虚构深市股东代码（generate.py、plan/契约示例）
    added_by: ops (T-O02a)
    added_at: 2026-11-01
  - rule: S6
    value_regex: '^0000000000$'
    reason: 虚构深市股东代码（第二个虚构值）
    added_by: ops (T-O02a)
    added_at: 2026-11-01
  - rule: generic-api-key
    value_regex: '^quote\.600519\.SH\.close$'
    reason: docs/plan.md 证据 key 示例（行情字段路径，不是密钥；gitleaks 默认规则误报，提交 ccf7cba）
    added_by: ops (T-O02a)
    added_at: 2026-11-01

  # fmt_a 脱敏主样本（plan §7.4A 夹具豁免条件 4）。按 path + 精确 sha256 登记：文件内容任何改动都会使登记失效，须重新核验。
  # rule 取 S7 而不是 '*'：条件 4 只看 path+sha256+reviewer+added_at；S7 对本目录本就按路径豁免，S5/S6 由 fake_identifiers 判定，故不额外放开任何规则。
  # 核验（T-O02 §9，只在本机比对、不输出取值）：股东代码/席位代码全部属于 meta.json fake_identifiers；
  # 与 /workspace/team/samples 真实交割单的股东代码、席位代码、委托/成交编号、申报序号交集均为 0；无姓名/账号/证件/手机/营业部字段；
  # 与本机真实密钥（环境变量与 .env）精确比对 0 命中。
  - rule: S7
