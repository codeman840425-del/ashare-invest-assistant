key: hold_risk_monitor
narrative: '# H-01 持仓风险体检 `hold_risk_monitor` — 正式卡 v1（T-R15，纯离场系统组件）


  > 正式卡。导入格式：plan 2.5.14 A 节三个带标签块。`mount_policy: system_only` 纯离场组件（G1 豁免依据，plan
  2.5.14 T-R15 裁定②；用户 POST /strategy-instances → 422 `STRATEGY_SYSTEM_ONLY`）：规则只含
  exit/weakening/counter/invalidation，`action_map` 不含 buy/add，**不产生任何新开仓**；只对持有中证券求值，未持有不出现在结论中；不能被用户实例化为普通模板。

  > 夹具全部数值**虚构**；`688018.SH`、`688073.SH`、`300364.SZ`、`301218.SZ` 仅为板块场景标签（`desc`），不代表真实行情。期望值由
  `golden/gen_T-R15.py` 确定性求值生成。

  > 结论只由规则决定；AI 只做中文解释。与用户启用的其他卡（如 L-01、W-01）结论相反时并列展示，不合并。


  ## 规则摘要

  - **离场 exit（任一为真 → `exit_signal`/sell）**：X1 盘中价 ≤ 计划止损（仅绑定计划时求值）；X2 收盘（qfq@T）< `ctx.cost_price_qfq`
  − `cost_atr_k`×ATR14（Wilder）；`ctx.cost_price_qfq` 由求值器按每笔成交 P×A(e)/A(T) 折算后加权，规则不直接使用不复权成本。

  - **转弱 weakening（任一为真 → `weakening`/reduce）**：W1 收盘连续 `ma_break_days` 根有效日 K 低于
  MA`ma_long`；W2 单只仓位占比 > `single_cap`；W3 行业仓位占比 > `sector_cap`（无行业归属记“未分类”，W3 为 null，不阻断）。

  - **反证 counter**（并列展示，不抵消离场）：C1 大盘 `uptrend`；C2 收盘 > MA20。**失效 invalidation**：I1
  收盘连续 `reclaim_days` 日重新站上 MA`ma_long`（转弱前提消失）。

  - **优先级**：exit > weakening > insufficient_data（X2 或 W1 无法求值且无任何命中）> hold_ok。`action_map={exit:
  sell, weakening: reduce, held_hold: hold, else: hold}`；`insufficient_data` 不是 map
  键，不产候选，建议显示 hold 并带缺口原因；数据缺失本身从不产生 sell/reduce。

  - N-01 风险公告对持仓只作反证（由系统组件挂载，不在本卡重复），不直接触发卖出。


  ## 时点 / 单位 / 复权 / 预热

  - 日线盘后求值（X1 另在盘中快照求值）；只用 as_of 及以前数据。价格统一 qfq@as_of（`x_qfq(d)=x(d)×A(d)/A(T)`）；`ctx.cost_price`
  持久化为不复权摊薄成本（分红计入，问题 19），规则只用 `ctx.cost_price_qfq`；`ctx.last_price` 只与不复权 `plan.stop_loss`
  比较。`ctx.position_weight`/`ctx.sector_weight` 为 0–1 小数。

  - 预热：MA60 + 3 − 1 = 62 根有效日 K，ATR14 15 根；不足时对应规则 `passed=null`。停牌日不计入有效 K。

  - 板块：涨跌停价按 `config/market_rules.yaml`（创业板/科创板现行 20%；注册制新股上市前 5 日无涨跌幅、limit 价 null）；止损价截断到涨跌停价之内。T+1：当日买入部分可卖
  0，信号照常、执行层 `T1_NOT_SELLABLE`。科创板持仓 < 200 股为零股，卖出/减仓须一次性全部申报（计划确认时按 `lot_rule` 校验）。


  ## 成本与滑点

  卖出：印花税 0.05%、佣金按用户费率（最低 5 元）、过户费 0.001%、基础滑点 10bp、冲击成本按参与率 5 档（plan 2.13，estimate）。离场类规则**不因成本放弃卖出**；成本只进入计划草案的价格区间与预估金额。


  ## 反证 / 失效（研究侧）

  H-01 不预测收益，只提示风险；证伪：模拟跟踪中 `exit_signal` 后 20 日收益显著高于持有（n ≥ 30，扣费），说明阈值过敏。






  > 夹具：每例带 `security{code,board,list_date}`；H01-FX10 停牌（`f.is_suspended`）；H01-FX11
  成本跨除权（10 送 5，A(d)=前 74 根 1.0、后 6 根 1.5，cost_qfq=cost×1.0/1.5）；H01-FX7 一字跌停卖出、H01-FX10
  停牌减仓：`expect.reason_details` 写 `direction: sell`，state 仍按规则为 exit_signal/weakening，但不可执行（plan
  2.5.14 T-R15 ⑧⑩）。'
