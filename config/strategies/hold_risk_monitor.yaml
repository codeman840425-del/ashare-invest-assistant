strategy-spec:
  action_map:
    else: hold
    exit: sell
    held_hold: hold
    weakening: reduce
  dimension_view_thresholds:
    bearish: 0.33
    bullish: 0.67
  horizons:
  - intraday_t
  - short
  - swing
  - long
  key: hold_risk_monitor
  kind: rule_template
  params_schema:
    cost_atr_k:
      default: 2.0
      desc: 成本缓冲 ATR 倍数
      max: 4.0
      min: 1.0
      step: 0.5
      type: float
    ma_break_days:
      default: 3
      desc: 跌破长期均线确认根数
      max: 5
      min: 2
      step: 1
      type: int
      unit: 有效日K
    ma_long:
      default: 60
      desc: 长期均线周期
      max: 120
      min: 40
      step: 5
      type: int
      unit: 有效日K
    reclaim_days:
      default: 2
      desc: 重新站上长期均线确认根数
      max: 5
      min: 1
      step: 1
      type: int
      unit: 有效日K
    sector_cap:
      default: 0.4
      desc: 行业仓位上限（0–1）
      max: 0.8
      min: 0.2
      step: 0.05
      type: float
    single_cap:
      default: 0.2
      desc: 单只仓位上限（0–1）
      max: 0.5
      min: 0.05
      step: 0.05
      type: float
  rules:
  - dimension: technical
    eval_time: intraday_1m
    expr: ctx.last_price <= plan.stop_loss
    id: X1
    required_features: []
    role: exit
    weight: 0
  - dimension: technical
    eval_time: daily_close
    expr: f.close_qfq < ctx.cost_price_qfq - p.cost_atr_k * atr(14)
    id: X2
    required_features:
    - f.close_qfq
    - f.high_qfq
    - f.low_qfq
    role: exit
    weight: 0
  - dimension: technical
    eval_time: daily_close
    expr: f.close_qfq < ma(f.close_qfq, p.ma_long) for p.ma_break_days days
    id: W1
    required_features:
    - f.close_qfq
    role: weakening
    weight: 0
  - dimension: technical
    eval_time: daily_close
    expr: ctx.position_weight > p.single_cap
    id: W2
    required_features: []
    role: weakening
    weight: 0
  - dimension: sector_market
    eval_time: daily_close
    expr: ctx.sector_weight > p.sector_cap
    id: W3
    required_features: []
    role: weakening
    weight: 0
  - dimension: sector_market
    eval_time: daily_close
    expr: f.market_regime == 'uptrend'
    id: C1
    required_features:
    - f.market_regime
    role: counter
    weight: 0
  - dimension: technical
    eval_time: daily_close
    expr: f.close_qfq > ma(f.close_qfq, 20)
    id: C2
    required_features:
    - f.close_qfq
    role: counter
    weight: 0
  - dimension: technical
    eval_time: daily_close
    expr: f.close_qfq > ma(f.close_qfq, p.ma_long) for p.reclaim_days days
    id: I1
    required_features:
    - f.close_qfq
    role: invalidation
    weight: 0
  screen: null
  stops:
    stop_loss: null
    take_profit: null
    time_stop_days: null
  valid_until:
    trading_days: 1
  version_no: 1
