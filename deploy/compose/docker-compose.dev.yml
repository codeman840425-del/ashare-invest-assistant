# 本地开发叠加层（deploy/scripts/up.sh 默认叠加）：
#   1) 麦蕊回放模式：ingest 强制 MAIRUI_MODE=replay。compose 不向任何容器传全站证书变量（T-O09），
#      所以即使开发者 shell 里临时设置了真实证书（本机实测用），本地容器也拿不到（plan §2.1A/§2.1B）。
#      回放数据读 tests/fixtures（只读挂载），录制的麦蕊样本约定放在 tests/fixtures/mairui/。
#   2) 热重载：把源码只读挂载进容器（覆盖镜像内 /app/src/backend；依赖在镜像 /opt/venv，不受影响）。
#      api 已用 `uvicorn app.main:app --reload`（T-O01a，只监视 app/，轮询模式）；
#      worker/beat/ingest/signal-rt 已用后端镜像的真实入口（T-O01b），改代码后 `compose.sh restart <服务>` 生效；
#      migrate 也挂源码，新加的迁移不用重建镜像即可在下次 up 时执行。
#      注意：改 pyproject/uv.lock 后需重新构建镜像（up.sh 默认带 --build）。
#   3) 便于调试：postgres / redis 只在 127.0.0.1 上暴露端口。
# 需要真实联调时（仅"当前唯一调用方"主机）：AIA_PROFILE=live deploy/scripts/up.sh（不叠加本文件）。

# 日志轮转（T-A04 ③）：所有容器统一 json-file，单文件 10m、保留 5 个（每容器最多约 50MB）。
# 每个服务都写 logging: *default-logging；CI（scripts/ci/check_compose_logging.py）检查每个服务都配了。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-dev-env: &dev-env
  APP_ENV: local
  APP_RELOAD: "true"
  WATCHFILES_FORCE_POLLING: "true"
  PYTHONDONTWRITEBYTECODE: "1"

services:
  migrate:
    logging: *default-logging
    environment:
      <<: *dev-env
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro

  api:
    logging: *default-logging
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*",
              "--reload", "--reload-dir", "/app/src/backend/app"]
    environment:
      <<: *dev-env
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro

  worker:
    logging: *default-logging
    environment:
      <<: *dev-env
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro

  ingest:
    logging: *default-logging
    environment:
      <<: *dev-env
      MAIRUI_MODE: replay
      MAIRUI_REPLAY_DIR: /fixtures/mairui
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro
      - ../../tests/fixtures:/fixtures:ro

  signal-rt:
    logging: *default-logging
    environment:
      <<: *dev-env
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro

  beat:
    logging: *default-logging
    environment:
      <<: *dev-env
    volumes:
      - ../../src/backend:/app/src/backend:ro
      - ../../config:/app/config:ro

  # 网关限流（T-O10）：dev 改挂宽松取值（同一容器路径覆盖基础文件的 limits.conf），避免测试方 live 契约套件/e2e 被网关 429。
  nginx:
    logging: *default-logging
    volumes:
      - ../nginx/limits.dev.conf:/etc/nginx/aia-limits.conf:ro

  postgres:
    logging: *default-logging
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"

  redis:
    logging: *default-logging
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
