# ashare-invest-assistant —— 基础编排（plan §1.3、§2.1A、§6）
# 一键启动（本地默认叠加 docker-compose.dev.yml = 回放模式）：deploy/scripts/up.sh
#
# 硬约束：MAIRUI_LICENCE 只出现在 ingest 的 environment 中；其他服务不得引用它，
#         且任何服务都不使用 env_file（避免把 .env 整体注入）。CI（T-O02）会检查。
# api 已是真实应用（T-O01a）：deploy/docker/backend.Dockerfile 构建（上下文 src/backend），uvicorn app.main:app。
# worker/beat/ingest/signal-rt 后端尚无入口，仍是占位（python:3.13 slim 的 http.server，只回 200）；
# 入口落地后改为复用 *backend-build / *backend-image，仅替换 command 与 healthcheck。

name: ${COMPOSE_PROJECT_NAME:-aia}

# 镜像全部固定到精确 tag + digest（T-O08）。升级流程：改 tag → docker buildx imagetools inspect <tag>
# 取新 digest → 本地 up.sh + db-restore-drill.sh 验证 → 提交。PG/TimescaleDB 升级还需按官方流程 ALTER EXTENSION。
x-placeholder-image: &placeholder-image python:3.13.18-slim-trixie@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5

# 占位入口：监听 8000，任意路径返回 200
x-placeholder-cmd: &placeholder-cmd ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/tmp"]

# 后端镜像（T-O01a）。dockerfile 路径相对 context；上下文过滤见 deploy/docker/backend.Dockerfile.dockerignore
x-backend-image: &backend-image ${AIA_BACKEND_IMAGE:-aia-backend:local}
x-backend-build: &backend-build
  context: ../../src/backend
  dockerfile: ../../deploy/docker/backend.Dockerfile

x-placeholder-healthcheck: &placeholder-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

# 所有应用服务共享的非敏感变量（不含 MAIRUI_*）
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@postgres:5432/${POSTGRES_DB:-aia}
  REDIS_URL: redis://redis:6379/0
  TZ: Asia/Shanghai
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 业务配置目录（仓库 config/ 只读挂载到这里；后端 Settings.config_dir）
  CONFIG_DIR: /app/config

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  nginx:
    image: nginx:1.31.2-alpine3.23@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: *backend-image
    build: *backend-build
    # 入口以 src/backend/app/main.py 为准；--proxy-headers 信任 nginx 的 X-Forwarded-*
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: api
      API_PREFIX: ${API_PREFIX:-/api/v1}
      HEALTH_CHECK_TIMEOUT_S: ${HEALTH_CHECK_TIMEOUT_S:-1.0}
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY 未设置}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      IMPORT_STORAGE_BACKEND: ${IMPORT_STORAGE_BACKEND:-local}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
    volumes:
      - imports:/var/lib/aia-dev/imports
      - ../../config:/app/config:ro
    depends_on: *app-depends
    # /health 恒返回 200（依赖异常体现在 body 的 status=degraded），这里只判活；判就绪看 body
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; u='http://127.0.0.1:8000'+os.environ.get('API_PREFIX','/api/v1')+'/health'; sys.exit(0 if urllib.request.urlopen(u, timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: *placeholder-image
    command: *placeholder-cmd
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY 未设置}
      IMPORT_STORAGE_BACKEND: ${IMPORT_STORAGE_BACKEND:-local}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - imports:/var/lib/aia-dev/imports
    depends_on: *app-depends
    healthcheck: *placeholder-healthcheck

  # 行情采集服务：全站唯一调用麦蕊、唯一持有 licence（plan §2.1A）
  ingest:
    image: *placeholder-image
    command: *placeholder-cmd
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      SERVICE_NAME: ingest
      MAIRUI_MODE: ${MAIRUI_MODE:-replay}
      MAIRUI_REPLAY_DIR: ${MAIRUI_REPLAY_DIR:-/fixtures/mairui}
      MAIRUI_LICENCE: ${MAIRUI_LICENCE:-}
      MAIRUI_BASE_URL: ${MAIRUI_BASE_URL:-https://api.mairuiapi.com}
      MAIRUI_PRO_BASE_URL: ${MAIRUI_PRO_BASE_URL:-https://pro.mairuiapi.com}
      MAIRUI_EGRESS_IP_EXPECTED: ${MAIRUI_EGRESS_IP_EXPECTED:-}
    depends_on: *app-depends
    healthcheck: *placeholder-healthcheck

  # 盘中信号计算：单实例，无 licence
  signal-rt:
    image: *placeholder-image
    command: *placeholder-cmd
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: signal-rt
    depends_on: *app-depends
    healthcheck: *placeholder-healthcheck

  # Celery beat：全站唯一
  beat:
    image: *placeholder-image
    command: *placeholder-cmd
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      SERVICE_NAME: beat
    depends_on: *app-depends
    healthcheck: *placeholder-healthcheck

  postgres:
    # TimescaleDB 2.31.0 + PostgreSQL 16.15（digest 固定 PG 小版本；plan §3A.1 避开 16.5/17.1）
    image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    restart: unless-stopped
    # 运行参数集中在 deploy/postgres/conf/postgresql.conf（T-O08 调优 + WAL）
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 1gb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: ${POSTGRES_DB:-aia}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/initdb/001-timescaledb.sql:/docker-entrypoint-initdb.d/zz-001-aia-timescaledb.sql:ro
      - ../postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # 走 TCP（初始化阶段只监听 unix socket），并确认 timescaledb 扩展已启用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"select 1 from pg_extension where extname='timescaledb'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  imports:
