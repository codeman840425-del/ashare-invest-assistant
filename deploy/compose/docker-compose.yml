# ashare-invest-assistant —— 基础编排（plan §1.3、§2.1A、§6）
# 一键启动（本地默认叠加 docker-compose.dev.yml = 回放模式）：deploy/scripts/up.sh
#
# 硬约束（T-A07 / T-O09）：不再有全站麦蕊证书变量；用户证书 HPKE 加密存库（plan §2.1B）。
#   证书封装私钥（docker secret data_licence_seal_private_keys）只挂给 ingest；公钥（data_licence_seal_public_keys）
#   挂给 api 与 ingest（ingest 轮换时要重新封装）。secret 是只读挂载，容器内路径 /run/secrets/<名>，
#   后端按同名设置项加载（pydantic-settings secrets_dir=/run/secrets：DATA_LICENCE_SEAL_PRIVATE_KEYS / _PUBLIC_KEYS）。
#   任何服务都不使用 env_file（避免把 .env 整体注入）。CI（scripts/ci/check_secret_boundary.py，CI job secret-boundary）检查这几条。
# 全部应用服务共用后端镜像（deploy/docker/backend.Dockerfile，上下文 src/backend）：
#   api（uvicorn app.main:app）、migrate（一次性：alembic upgrade head）、
#   worker/beat/ingest/signal-rt（python -m app.workers.<名>，T-B02 入口；目前为后端的常驻占位实现，
#   不连外部服务、ingest 只写 Redis 心跳、不读 licence）。
# 启动顺序（T-O01b）：postgres/redis healthy → migrate（alembic upgrade head）成功退出
#   → timescale-apply（postgres 镜像内跑 deploy/scripts/db-apply-timescale.sh，按 policies.conf 补压缩/保留/连续聚合）成功退出
#   → api / worker / beat / ingest / signal-rt → nginx。

# 项目名由 deploy/scripts/compose.sh 解析后用 -p 传入并导出（只认 deploy/env/.env，不认 shell，T-O03）；
# 不经 compose.sh 直接调用时这里报错，避免回落到所有工作树共用的“aia”。
name: ${COMPOSE_PROJECT_NAME:?请用 deploy/scripts/compose.sh（或 up.sh）调用}

# 日志轮转（T-A04 ③）：所有容器统一 json-file，单文件 10m、保留 5 个（每容器最多约 50MB）。
# 每个服务都写 logging: *default-logging；CI（scripts/ci/check_compose_logging.py）检查每个服务都配了。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 镜像全部固定到精确 tag + digest（T-O08）。升级流程：改 tag → docker buildx imagetools inspect <tag>
# 取新 digest → 本地 up.sh + db-restore-drill.sh 验证 → 提交。PG/TimescaleDB 升级还需按官方流程 ALTER EXTENSION。
# 后端镜像（T-O01a）。dockerfile 路径相对 context；上下文过滤见 deploy/docker/backend.Dockerfile.dockerignore
# 未设置时 compose.sh 导出 aia-backend:<项目名>，各工作树的构建互不覆盖（T-O03）
x-backend-image: &backend-image ${AIA_BACKEND_IMAGE:-aia-backend:local}
x-backend-build: &backend-build
  context: ../../src/backend
  dockerfile: ../../deploy/docker/backend.Dockerfile

# worker 类健康检查（T-B02 §8.2）：存活文件 45 秒内更新过即健康；参数为服务名
x-worker-healthcheck: &worker-healthcheck
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 20s

# 所有应用服务共享的非敏感变量（不含 MAIRUI_*）
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@postgres:5432/${POSTGRES_DB:-aia}
  REDIS_URL: redis://redis:6379/0
  TZ: Asia/Shanghai
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # 业务配置目录（仓库 config/ 只读挂载到这里；后端 Settings.config_dir）
  CONFIG_DIR: /app/config

# APP_MASTER_KEY（T-O11）：不再经 .env/environment 传入，只走 secret 文件 app_master_key（600，属主容器用户），
# 由 deploy/docker/secret-env.sh（只读挂载为入口包装）在容器进程内转成 APP_MASTER_KEY；docker inspect 看不到它。
x-secret-env-entrypoint: &secret-env-entrypoint ["sh", "/aia/secret-env.sh"]
x-secret-env-mount: &secret-env-mount ../docker/secret-env.sh:/aia/secret-env.sh:ro

# 原始导入文件卷（T-B46 / T-O11，plan §3.5A）：挂载点跟随 IMPORT_STORAGE_PATH；只挂给写入/读取的 api，
# 以及删除用户数据时清文件的 maint-cli（按需 run）。worker / ingest / beat / signal-rt 不挂。
# 卷根目录属主 10001、权限 700（镜像内预建目录决定新卷的初始属主；已有卷由运维 chmod 一次）。

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  timescale-apply:
    condition: service_completed_successfully
  db-roles:
    condition: service_completed_successfully

# 分库角色（T-O10）：api / ingest 不再用库属主连接。aia_api 读不到证书密文列（列级授权），aia_ingest 全列；
# 属主（POSTGRES_USER）只给 migrate / timescale-apply / db-roles 以及暂未拆分的 worker、signal-rt、beat。
# 口令不进 .env、不进仓库：由 deploy/scripts/compose.sh 从 $AIA_SECRETS_DIR/db_password_aia_{api,ingest}（600，
# 缺失时 deploy/scripts/db-role-passwords.sh 生成、从不覆盖）读出后导出给 compose 插值。
x-db-api-url: &db-api-url postgresql+psycopg://aia_api:${AIA_DB_API_PASSWORD:?请用 deploy/scripts/compose.sh 调用（读 db_password_aia_api）}@postgres:5432/${POSTGRES_DB:-aia}
x-db-ingest-url: &db-ingest-url postgresql+psycopg://aia_ingest:${AIA_DB_INGEST_PASSWORD:?请用 deploy/scripts/compose.sh 调用（读 db_password_aia_ingest）}@postgres:5432/${POSTGRES_DB:-aia}

services:
  nginx:
    logging: *default-logging
    image: nginx:1.31.2-alpine3.23@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/limits.conf:/etc/nginx/aia-limits.conf:ro
    depends_on:
      api:
        condition: service_healthy
    # 外部 DNS 断开（T-O13 补）：nginx 只需解析同网络的服务名（api），由 Docker 内置 DNS 127.0.0.11 直接回答；
    # 查不到的名字（例如 api 停机/重建的那几秒）内置 DNS 会转发给容器的上游 DNS。默认上游是宿主 DNS，
    # 宿主若对未知名字给假 IP（沙箱的 198.18.0.0/15、某些运营商的劫持页），nginx 会把带 Cookie 的请求发到外部。
    # 上游设成容器内无人监听的 127.0.0.1 → 外部名字一律 SERVFAIL → nginx 502，请求不出本机；服务名解析不受影响。
    dns:
      - 127.0.0.1
    # 健康检查（T-O13）：经 nginx 探上游 /health/live（= 后端 /api/v1/health/live），而不是 nginx 自答的 /healthz。
    # 上游挂了或 nginx 连不上上游（502/504）→ unhealthy；上游恢复后（resolver 每 10s 重新解析）自动回到 healthy。
    # 不加 restart/autoheal：unhealthy 只用于告警与 compose --wait，nginx 本身不需要重启。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    logging: *default-logging
    image: *backend-image
    build: *backend-build
    # 入口以 src/backend/app/main.py 为准；--proxy-headers 信任 nginx 的 X-Forwarded-*
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: api
      DATABASE_URL: *db-api-url
      API_PREFIX: ${API_PREFIX:-/api/v1}
      HEALTH_CHECK_TIMEOUT_S: ${HEALTH_CHECK_TIMEOUT_S:-1.0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # 契约 registration_mode：closed（V1 默认，/auth/register → 503 REGISTRATION_CLOSED）| invite | open（保留，V1 不用）
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      # 本地 http 调试 false；live/生产 profile 必须 true（APP_ENV 不是 local/test 时为 false → 后端启动失败，plan 6.1）
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      IMPORT_STORAGE_BACKEND: ${IMPORT_STORAGE_BACKEND:-local}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
      # 证书封装：api 只有公钥（只能加密）；当前版本号
      DATA_LICENCE_SEAL_KEY_VERSION: ${DATA_LICENCE_SEAL_KEY_VERSION:-1}
      # 没挂 app_master_key 就拒绝启动，不回落临时主密钥（T-O11 评审 M1）
      AIA_REQUIRE_APP_MASTER_KEY: "1"
    entrypoint: *secret-env-entrypoint
    secrets:
      - data_licence_seal_public_keys
      - app_master_key
    volumes:
      - imports:${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
      - ../../config:/app/config:ro
      - *secret-env-mount
    depends_on: *app-depends
    # 存活探针 ${API_PREFIX}/health/live（不依赖 db/redis，T-B02 §8.1）；就绪看 /health/ready 的 HTTP 码
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; u='http://127.0.0.1:8000'+os.environ.get('API_PREFIX','/api/v1')+'/health/live'; sys.exit(0 if urllib.request.urlopen(u, timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    logging: *default-logging
    image: *backend-image
    command: ["python", "-m", "app.workers.worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      # T-A04 ④（review-028c077 M1）：worker 以 aia_api 连库（不用属主）；所需 DML 见 deploy/db/roles/grants.sql $worker$
      DATABASE_URL: *db-api-url
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AIA_REQUIRE_APP_MASTER_KEY: "1"
    entrypoint: *secret-env-entrypoint
    secrets:
      - app_master_key
    volumes:
      - ../../config:/app/config:ro
      - *secret-env-mount
    depends_on: *app-depends
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "worker"]

  # 行情采集服务：全站唯一调用麦蕊、唯一能解密用户证书（plan §2.1A、§2.1B）
  ingest:
    logging: *default-logging
    image: *backend-image
    command: ["python", "-m", "app.workers.ingest"]
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      SERVICE_NAME: ingest
      DATABASE_URL: *db-ingest-url
      MAIRUI_MODE: ${MAIRUI_MODE:-replay}
      MAIRUI_REPLAY_DIR: ${MAIRUI_REPLAY_DIR:-/fixtures/mairui}
      MAIRUI_BASE_URL: ${MAIRUI_BASE_URL:-https://api.mairuiapi.com}
      MAIRUI_PRO_BASE_URL: ${MAIRUI_PRO_BASE_URL:-https://pro.mairuiapi.com}
      MAIRUI_EGRESS_IP_EXPECTED: ${MAIRUI_EGRESS_IP_EXPECTED:-}
      DATA_LICENCE_SEAL_KEY_VERSION: ${DATA_LICENCE_SEAL_KEY_VERSION:-1}
      # 不得持有主密钥（plan e56462c 按服务分配）：入口包装发现 APP_MASTER_KEY / app_master_key 即拒绝启动
      AIA_FORBID_APP_MASTER_KEY: "1"
    entrypoint: *secret-env-entrypoint
    # 私钥只在这里出现（CI 检查）
    secrets:
      - data_licence_seal_private_keys
      - data_licence_seal_public_keys
    volumes:
      - ../../config:/app/config:ro
      - *secret-env-mount
    depends_on: *app-depends
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "ingest"]

  # 盘中信号计算：单实例，无 licence
  signal-rt:
    logging: *default-logging
    image: *backend-image
    command: ["python", "-m", "app.workers.signal_rt"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: signal-rt
    volumes:
      - ../../config:/app/config:ro
    depends_on: *app-depends
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "signal-rt"]

  # Celery beat：全站唯一
  beat:
    logging: *default-logging
    image: *backend-image
    command: ["python", "-m", "app.workers.beat"]
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      SERVICE_NAME: beat
    volumes:
      - ../../config:/app/config:ro
    depends_on: *app-depends
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "beat"]

  # 到期证书冷却记录的定时清理由 beat 调度、worker 执行（后端 6670b10，任务 licences.purge_expired_cooldowns），
  # 原 deploy 的 cooldown-purge 服务已删除（review-6670b10 m5）。

  # 一次性：数据库迁移（T-O01b）。成功退出（0）后 timescale-apply 才运行；失败则 api 等服务不会启动。
  migrate:
    logging: *default-logging
    image: *backend-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *app-env
      SERVICE_NAME: migrate
    volumes:
      - ../../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 一次性：TimescaleDB 部署侧策略（压缩/保留/连续聚合，deploy/db/timescale/policies.conf）。
  # 后端镜像没有 psql，放在 postgres 镜像里经网络直连执行（AIA_PSQL_MODE=direct）；脚本幂等，每次 up 都会重跑。
  timescale-apply:
    logging: *default-logging
    # 与 postgres 服务同一镜像（含 psql）；升级时两处一起改（deploy/scripts/lib/common.sh 的 aia_compose_image 读 postgres 服务那一行）
    image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    entrypoint: ["bash", "/aia/deploy/scripts/db-apply-timescale.sh"]
    command: []
    restart: "no"
    environment:
      AIA_ROOT: /aia
      AIA_PSQL_MODE: direct
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-aia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      PGDATABASE: ${POSTGRES_DB:-aia}
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - ../scripts:/aia/deploy/scripts:ro
      - ../db/timescale:/aia/deploy/db/timescale:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 角色与列级授权（T-O10）：migrate、timescale-apply 之后幂等执行 deploy/db/roles/apply-roles.sh（每次 up 都跑，
  # 新迁移建的表/列也会被覆盖到）。以属主连接；口令以 secret 文件传入，不经环境变量。
  db-roles:
    logging: *default-logging
    image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    entrypoint: ["bash", "/aia/deploy/db/roles/apply-roles.sh"]
    command: []
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-aia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      PGDATABASE: ${POSTGRES_DB:-aia}
      PGCONNECT_TIMEOUT: "10"
      AIA_DB_ROLE_PASSWORD_DIR: /run/secrets
    secrets:
      - db_password_aia_api
      - db_password_aia_ingest
      - db_password_aia_maint
    volumes:
      - ../db/roles:/aia/deploy/db/roles:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      timescale-apply:
        condition: service_completed_successfully

  # 删除用户数据 CLI（T-O11，plan §7.3）：只按需运行，up 不会启动它（profile maint）。以 aia_maint 连库：
  # secret db_password_aia_maint 只挂给它和 db-roles，secret-env.sh 在容器内拼 DSN、导出 AIA_MAINT_DATABASE_URL_FILE。
  # 没有属主 DATABASE_URL（不回落到属主）。用法（先 dry-run，确认后再 --execute，会交互要求输入完整 user-id）：
  #   deploy/scripts/compose.sh --profile maint run --rm --no-deps maint-cli --user-id <uuid> [--execute]
  maint-cli:
    logging: *default-logging
    image: *backend-image
    profiles: ["maint"]
    entrypoint: ["sh", "/aia/secret-env.sh", "python", "-m", "app.cli", "delete-user-data"]
    command: ["--help"]
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: maint-cli
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONFIG_DIR: /app/config
      REDIS_URL: redis://redis:6379/0
      AIA_MAINT_DB_HOST: postgres
      AIA_MAINT_DB_PORT: "5432"
      AIA_MAINT_DB_NAME: ${POSTGRES_DB:-aia}
      IMPORT_STORAGE_PATH: ${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
      AIA_IMPORTS_DIR: ${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
    secrets:
      - db_password_aia_maint
    volumes:
      - imports:${IMPORT_STORAGE_PATH:-/var/lib/aia-dev/imports}
      - ../../config:/app/config:ro
      - *secret-env-mount
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    logging: *default-logging
    # TimescaleDB 2.31.0 + PostgreSQL 16.15（digest 固定 PG 小版本；plan §3A.1 避开 16.5/17.1）
    image: timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    restart: unless-stopped
    # 运行参数集中在 deploy/postgres/conf/postgresql.conf（T-O08 调优 + WAL）
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 1gb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: ${POSTGRES_DB:-aia}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/initdb/001-timescaledb.sql:/docker-entrypoint-initdb.d/zz-001-aia-timescaledb.sql:ro
      - ../postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # 走 TCP（初始化阶段只监听 unix socket），并确认 timescaledb 扩展已启用
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"select 1 from pg_extension where extname='timescaledb'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    logging: *default-logging
    image: redis:7.4.12-alpine3.21@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

# 数据卷显式命名 <AIA_VOLUME_PREFIX>_*（T-O03）：前缀由 compose.sh 从 .env 解析（缺省 = 项目名），
# 项目改名时把前缀设成旧项目名即可沿用原卷；down -v 只会删除本项目解析出的这几个卷。
volumes:
  pgdata:
    name: ${AIA_VOLUME_PREFIX:?请用 deploy/scripts/compose.sh 调用}_pgdata
  redisdata:
    name: ${AIA_VOLUME_PREFIX:?请用 deploy/scripts/compose.sh 调用}_redisdata
  imports:
    name: ${AIA_VOLUME_PREFIX:?请用 deploy/scripts/compose.sh 调用}_imports

# 证书封装密钥（T-O09）：由 deploy/scripts/seal-keygen.sh 生成在仓库外的 AIA_SECRETS_DIR（compose.sh 解析，
# 默认 ~/.config/aia/secrets/<卷前缀>）。私钥 600、属主为容器用户；不入库、不进镜像、不进 .env。
# 备份与轮换见 deploy/runbooks/data-licence-seal-keys.md（私钥丢失 = 已加密证书无法解密）。
secrets:
  data_licence_seal_private_keys:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/data_licence_seal_private_keys
  data_licence_seal_public_keys:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/data_licence_seal_public_keys
  # 分库角色口令（T-O10）：deploy/scripts/db-role-passwords.sh 生成（600，不覆盖）；只挂给 db-roles。
  db_password_aia_api:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/db_password_aia_api
  db_password_aia_ingest:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/db_password_aia_ingest
  # 删除用户数据 CLI 角色口令（T-O11）：同上生成，属主容器用户；只挂给 db-roles 与 maint-cli（CI 检查）。
  db_password_aia_maint:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/db_password_aia_maint
  # APP_MASTER_KEY（T-O11；M1）：compose.sh 经 deploy/scripts/app-master-key-ensure.sh 准备（已有→用；旧 .env→迁移；
  # 库有数据→拒绝启动；只有全新空库才生成；600，属主容器用户，不覆盖）；只挂给 api 与 worker。
  app_master_key:
    file: ${AIA_SECRETS_DIR:?请用 deploy/scripts/compose.sh 调用}/app_master_key
