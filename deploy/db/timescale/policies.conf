# =====================================================================
# TimescaleDB 部署侧策略参数 —— 唯一配置源（T-O08）
# 应用：deploy/scripts/db-apply-timescale.sh [--db aia] [--dry-run]
#
# 原则：
#   * 表结构（建表、主键、索引）归后端迁移（alembic）所有；这里只做 hypertable 转换、
#     chunk 间隔、压缩、保留、连续聚合及其刷新策略。
#   * 表不存在 / 时间列不存在 → 打印 SKIP 后跳过，不报错（可在建表前后任意次重复执行）。
#   * 幂等：已符合配置的项不做任何改动；参数变化时只调整对应策略。
#   * 普通表已有数据时默认不做 hypertable 转换（需显式 AIA_TS_MIGRATE_DATA=1，会锁表复制数据）。
#
# 语法：每行一项，字段用 | 分隔，前后空格忽略；"-" 表示"不管理"（既不添加也不删除）；
#       "none" 表示"确保没有"（删除已有策略，不解压已压缩数据）。
#       列名可写 "a/b"：取表中第一个存在的列（plan §3.3 用 code，§3A.6 用 security_id，见报告"后端协调"）。
#       区间用 PostgreSQL interval 写法，如 1 day / 7 days / 3 years。
#
# hypertable | 表 | 时间列 | chunk 间隔 | 压缩 segmentby | 压缩 orderby | 多久后压缩 | 保留期
# cagg | 视图名 | 源 hypertable | 定义文件(caggs/) | 刷新 start_offset | 刷新 end_offset | 刷新间隔 | 多久后压缩 | 保留期
# =====================================================================

# --- 行情 ---
# 1 分钟 K：plan §3.3 / §3A.6 chunk 1 天、7 天后压缩；问题 28：全市场 1 年、股票池 3 年 →
# 表级保留取上限 3 年（1095 天），"非股票池证券 1 年后删除"是行级规则，由后端定时任务做。
hypertable | market.minute_bars      | ts         | 1 day    | security_id/code | ts DESC | 7 days  | 1095 days
# 实时快照（分钟降采样）：plan 默认保留 10 个交易日；按日历天配置 21 天，覆盖春节/国庆长假。
hypertable | market.realtime_quotes  | ts         | 1 day    | security_id/code | ts DESC | 7 days  | 21 days
# 日 K：plan "按年分区"、永久保留；体量小（全市场约 1.3M 行/年），且复权回补需要原地更新 → 不压缩。
hypertable | market.daily_bars       | trade_date | 1 year   | -                | -       | -       | -
# 因子值（窄表 code × factor_id × trade_date）：§3.3 chunk 1 个月；按 factor_id 分段（截面查询为主）。
hypertable | market.factor_values    | trade_date | 1 month  | factor_id        | security_id/code, trade_date DESC | 90 days | -
# 日频特征宽表：§3A "按年存为 hypertable 并压缩"；上一年 chunk 结束 30 天后压缩。
hypertable | market.feature_bars_daily | trade_date | 1 year | security_id/code | trade_date DESC | 30 days | -
# 资金流：plan 数据模型标注为 hypertable（字段未定），先给默认值，表不存在时自动跳过。
hypertable | market.fund_flows       | trade_date | 1 year   | -                | -       | -       | -

# --- 运维 ---
# 麦蕊请求元数据日志：保留 30 天；数据量小、生命周期短，不压缩。
hypertable | ops.ingest_request_log  | requested_at | 1 day  | -                | -       | -       | 30 days

# --- 连续聚合（plan §3A.3，用于校验日 K / 5 分钟视图） ---
cagg | market.bars_5m             | market.minute_bars | bars_5m.sql             | 3 days  | 5 minutes | 5 minutes | 30 days | -
cagg | market.bars_daily_from_1m  | market.minute_bars | bars_daily_from_1m.sql  | 10 days | 1 hour    | 1 hour    | -       | -
