# 网关限流参数（T-O10，生产/live 取值；dev 叠加文件改挂 limits.dev.conf）。由 nginx.conf 在 http{} 内 include。
# 依据：契约 §1.3“超限 429 RATE_LIMITED，头 Retry-After（秒）”、§2 details {retry_after_s}；
#      plan 3.x“全局：Nginx limit_req + 应用层 Redis 滑动窗口”；T-B03a 应用层：登录同 IP ≤ 10 次/分、注册同 IP ≤ 5 次/时、
#      ≤ 20 次/日（精确限速与 Retry-After 由后端算）；T-B45 PUT /me/data-licence 每小时 10 次（后端）。
# 定位：nginx 是“防洪”外层，取值宽于应用层，使正常超限先由后端返回精确的 429 与 retry_after_s；
#      只有异常洪泛才在网关被挡。键一律 $binary_remote_addr（nginx 看到的直连地址，不信任客户端头）。
# aia_import 的键 $aia_import_key 在 nginx.conf 里由 map 得到：POST 等写方法 = $binary_remote_addr，GET/HEAD = 空串（nginx 不计数），
# 这样只限上传（POST /api/v1/imports），不误伤批次列表轮询（GET /api/v1/imports）。
# 三个 zone 名与 nginx.conf 中 limit_req 引用一致；$aia_retry_after_s 必须 = ceil(1 / 速率)（scripts/ci/check_gateway_limits.py 校验）。
limit_req_zone $binary_remote_addr zone=aia_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=aia_auth:10m rate=20r/m;
limit_req_zone $aia_import_key zone=aia_import:10m rate=6r/m;

map $uri $aia_retry_after_s {
  default                                   1;
  "~^/api/v1/auth/(login|register)$"        3;
  "~^/api/v1/imports$"                      10;
}
