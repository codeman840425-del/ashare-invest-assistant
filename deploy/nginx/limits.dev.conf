# 网关限流参数——开发/测试环境（T-O10）：docker-compose.dev.yml 把它挂到 /etc/nginx/aia-limits.conf，覆盖 limits.conf。
# 原因：测试方 live 契约套件（schemathesis，单 IP 连发）和 e2e 会在短时间内从同一地址打出大量请求；
# limit_req 的 burst 写在 nginx.conf 的 location 里（不能用变量），只放宽速率挡不住本机毫秒级连发（实测 600r/m + burst 10
# 连发 60 次仍有 49 次 429）。所以 dev 用 limit_req_dry_run：zone、键、429 信封与生产完全一致，超限只记日志
# （error.log 里 "limiting requests, dry run"，可据此估算生产取值是否会误伤），不真正拒绝。
# 精确限速仍由后端应用层负责（T-B03a）。正反验证用 limits.conf（生产取值）做，见 scripts/ci/nginx_limits_smoke.sh。
limit_req_dry_run on;
limit_req_zone $binary_remote_addr zone=aia_api:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=aia_auth:10m rate=600r/m;
limit_req_zone $aia_search_key zone=aia_search:10m rate=1000r/s;
limit_req_zone $aia_import_key zone=aia_import:10m rate=600r/m;

map $uri $aia_retry_after_s {
  default                                   1;
  "~^/api/v1/auth/(login|register)$"        1;
  "~^/api/v1/securities(/search)?$"         1;
  "~^/api/v1/imports$"                      1;
}
