# 占位配置（T-O01/T-O01a/T-O01b）：/healthz 由 nginx 自答（不依赖上游）+ /api 反代到 api（全部方法透传，见 @nginx_405）。TLS、静态资源、SSE 透传在后续任务补全。
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream api_upstream { server api:8000; }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # proxy_pass 不带 URI（无末尾斜杠）：原样转发 /api/v1/...，与后端 API_PREFIX=/api/v1 对齐（T-O01a）。
    # 之前写成 http://api_upstream/ 会把 /api/ 替换成 /，后端收到 /v1/health → 404。
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 方法透传（T-O01b）：nginx 对 TRACE（及 TRACK 以外少数方法）在进入 location 之前就自答 405，且不带 Allow 头，
    # 和后端直连结果不一致（契约测试 unsupported_method 经 nginx 失败）。这里把 nginx 自产的 405 转进命名 location：
    # /api/ 下的请求原样（保留方法）反代给后端，由后端返回 405 + 与路由一致的 Allow 头；
    # 非 /api/ 路径仍由 nginx 回 405，并补上本层实际支持的 Allow。
    # 后端（或上游）返回的 405 不经过这里（未开 proxy_intercept_errors），原样透传。
    error_page 405 = @nginx_405;

    location @nginx_405 {
      if ($uri !~ "^/api/") {
        add_header Allow "GET, HEAD" always;
        return 405;
      }
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 200 "ashare-invest-assistant placeholder (frontend not built yet)\n";
    }
  }
}
