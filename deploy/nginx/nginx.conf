# 占位配置（T-O01/T-O01a/T-O01b/T-O03/T-O13）：/healthz 由 nginx 自答（不依赖上游）+ /health/live 反代到后端存活检查（容器 healthcheck 探它，T-O13） + /api 反代到 api（全部方法透传，见 @nginx_405）；
# X-Request-Id 透传/生成（$aia_request_id）；请求体超过网关上限回 413 JSON 信封（@payload_too_large）；limit_req 限流回 429 JSON 信封（@rate_limited，T-O10）。TLS、静态资源、SSE 透传在后续任务补全。
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  error_log /dev/stderr warn;

  # 上游动态解析（T-O13）：以前写成静态 upstream 块（server api:8000），nginx 只在启动/reload 时解析一次，
  # api 容器重建换了 IP 后一直连旧地址 → 502，而 nginx 自身健康检查（/healthz）照样 healthy（部署 0f8129b 时实际遇到）。
  # 现在：Docker 内置 DNS（127.0.0.11）+ 短缓存 valid=10s，proxy_pass 用变量 $aia_api_upstream，按请求解析。
  # 变量形式 proxy_pass 的 URI 语义：不带 URI 时与静态写法相同（原样转发客户端请求行里的 URI 与参数）；
  # 带 URI 时整段替换且不自动追加参数，所以 /health/live 显式写 $is_args$args（与静态写法行为一致）。
  # 用 map 而不是 server 里的 set：nginx 自产 405（TRACE 等）在 rewrite 阶段之前就转进 @nginx_405，set 的变量会是空的。
  # 只解析 IPv4（Docker 网络默认无 IPv6）；解析失败 → 502（与上游不可达时相同）。
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  map $host $aia_api_upstream {
    default "api:8000";
  }

  # request_id（契约 §1“响应头 X-Request-Id；客户端可传入同名头”，§2 error.request_id 与响应头一致；review-T-B02 m6）。
  # 契约未规定格式，校验规则与后端 app/common/request_id.py 的 _SAFE_ID 一致：[A-Za-z0-9._:-]，长度 1–128。
  # 合法则原样透传；缺失、空、含其他字符或超长则丢弃，生成 req_ + 32 位十六进制（与后端 new_request_id 同格式）。
  # 两边规则一致，所以后端收到的值一定会被它原样接受，nginx 日志、后端日志、响应头三处是同一个值。
  map $http_x_request_id $aia_request_id {
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
    default                     "req_$request_id";
  }

  log_format aia '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" request_id=$aia_request_id';
  access_log /dev/stdout aia;

  # 网关请求体上限（契约 v0.2.3 §4 413 PAYLOAD_TOO_LARGE，只用于网关/框架上限）。
  # 应用上限：plan §3.5“单文件 ≤ 5 MB，单次 ≤ 5 个文件”= 25 MB 文件内容 + multipart 开销；
  # 键已由架构师定在 config/imports.yaml（plan 6.1，7c62f59）：max_request_bytes = 26m = 27262976，
  # 必须 > max_file_bytes × max_files_per_upload。三处一致性由 CI scripts/ci/check_gateway_limits.py 校验。这里取 26m：
  # 5 MB + 1 字节的单文件仍能到达后端，由后端回 422 IMPORT_FILE_ERRORS/IMPORT_FILE_TOO_LARGE。
  # 改这个值时同步改 @payload_too_large 里的 max_bytes（26 × 1024 × 1024 = 27262976）。
  client_max_body_size 26m;

  # 限流（T-O10）：zone 定义与 Retry-After 映射在 include 文件里，生产/live 用 deploy/nginx/limits.conf，
  # dev 叠加文件改挂 limits.dev.conf（只放宽速率）。键 = $binary_remote_addr；超限 429 + JSON 信封（@rate_limited）。
  # aia_import 只计写方法：GET/HEAD 的键为空串，nginx 不计数（批次列表轮询不受影响）。
  map $request_method $aia_import_key {
    GET     "";
    HEAD    "";
    default $binary_remote_addr;
  }
  # 证券搜索专用桶 aia_search（T-A04 ⑤，架构师定）：只计 /api/v1/securities/search 与带 ?q= 的 /api/v1/securities，
  # 键 = 来源地址；其它 /securities/*（详情等）键为空串，不进本桶（仍受全站 aia_api 约束）。
  # 用 "$uri?$args" 拼接匹配：q 出现在参数任意位置（含 q= 空值）都算搜索。
  map "$uri?$args" $aia_search_key {
    "~^/api/v1/securities/search\?"          $binary_remote_addr;
    "~^/api/v1/securities\?(.*&)?q="         $binary_remote_addr;
    default                                  "";
  }
  include /etc/nginx/aia-limits.conf;
  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 80;
    server_name _;

    # 请求行 / 单个请求头的上限（T-live-0f8129b F-1）：取 nginx 默认值显式写出，414/494 信封里的 max_bytes 与它一致（CI 检查）。
    # 只有这一个 server（也是 default_server），请求行在选 server 之前读取，用的就是这里的值。
    large_client_header_buffers 4 8k;

    # 反代 location 一律覆盖 X-Real-IP = $remote_addr（review-T-B03 M1）：客户端自带的 X-Real-IP 不再透传，
    # 后端审计 ip_hash / 限速拿到的是 nginx 看到的直连地址。X-Forwarded-For 仍用 $proxy_add_x_forwarded_for
    # （追加，最左段可被客户端伪造，后端不得用它判定来源；评审对 XFF 无额外要求，可信代理列表由后端 T-B03a 做）。
    # @payload_too_large 由 nginx 自答、不转发，不涉及。

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # 根路径 /health/live（T-O03）：以前落在占位 location / 上恒 200，不是真正的健康检查。
    # 选择：反代到后端 ${API_PREFIX}/health/live（存活，不访问依赖），与 /api/v1/health/live 结果一致；
    # /healthz 仍由 nginx 自答（不依赖上游）；容器 healthcheck 改探 /health/live（T-O13），上游挂了 nginx 也变 unhealthy。
    # API_PREFIX 改了要同步这里与 location /api/。
    location = /health/live {
      proxy_pass http://$aia_api_upstream/api/v1/health/live$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy_pass 不带 URI（无末尾斜杠）：原样转发 /api/v1/...，与后端 API_PREFIX=/api/v1 对齐（T-O01a）。
    # 之前写成 http://api_upstream/ 会把 /api/ 替换成 /，后端收到 /v1/health → 404。变量形式（T-O13）同样不带 URI。
    # 全局限流：/api/ 下所有请求按来源地址 aia_api（突发 100，不排队直接放行/拒绝）。
    location /api/ {
      limit_req zone=aia_api burst=100 nodelay;
      proxy_pass http://$aia_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 更严的限流（T-O10）：登录、注册与导入上传在全局之外再叠一层；精确限速（10 次/分、5 次/时）在后端 T-B03a。
    location ~ ^/api/v1/auth/(login|register)$ {
      limit_req zone=aia_api burst=100 nodelay;
      limit_req zone=aia_auth burst=10 nodelay;
      proxy_pass http://$aia_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/imports {
      limit_req zone=aia_api burst=100 nodelay;
      limit_req zone=aia_import burst=5 nodelay;
      proxy_pass http://$aia_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 证券（T-A04 ⑤）：/api/v1/securities 与其下所有路径。全站 aia_api 之外再叠搜索桶 aia_search（5r/s、突发 20，
    # 键见 $aia_search_key：非搜索请求键为空、不计数）；超限同样走 @rate_limited（429 RATE_LIMITED + Retry-After）。
    # 所有响应强制 Cache-Control: private, no-store（隐去上游自带的 Cache-Control；always = 网关自产的 502/504 也带）；
    # 网关自产的 429/413/414/400 信封在各自 location 里同样是 private, no-store。不启用 proxy_cache（CI 规则 11 禁止）。
    location ~ ^/api/v1/securities(/|$) {
      limit_req zone=aia_api burst=100 nodelay;
      limit_req zone=aia_search burst=20 nodelay;
      proxy_pass http://$aia_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "private, no-store" always;
    }

    # 方法透传（T-O01b）：nginx 对 TRACE（及 TRACK 以外少数方法）在进入 location 之前就自答 405，且不带 Allow 头，
    # 和后端直连结果不一致（契约测试 unsupported_method 经 nginx 失败）。这里把 nginx 自产的 405 转进命名 location：
    # /api/ 下的请求原样（保留方法）反代给后端，由后端返回 405 + 与路由一致的 Allow 头；
    # 非 /api/ 路径仍由 nginx 回 405，并补上本层实际支持的 Allow。
    # 后端（或上游）返回的 405 不经过这里（未开 proxy_intercept_errors），原样透传。
    error_page 405 = @nginx_405;

    location @nginx_405 {
      if ($uri !~ "^/api/") {
        add_header Allow "GET, HEAD" always;
        add_header X-Request-Id $aia_request_id always;
        return 405;
      }
      proxy_pass http://$aia_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $aia_request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 413：nginx 自产（Content-Length 或分块累计超过 client_max_body_size），后端收不到这个请求，
    # 所以由 nginx 按契约 §2 错误信封返回 JSON，request_id 与响应头 X-Request-Id 一致。
    # 后端自己返回的 413（框架层）不经过这里（未开 proxy_intercept_errors），原样透传。
    error_page 413 @payload_too_large;

    location @payload_too_large {
      default_type "application/json; charset=utf-8";
      add_header X-Request-Id $aia_request_id always;
      add_header Cache-Control "private, no-store" always;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"请求体过大","details":{"max_bytes":27262976},"request_id":"$aia_request_id"}}';
    }

    # 414：请求行（方法 + URI + 协议）超过 large_client_header_buffers 单个缓冲（8k）时 nginx 在读请求头阶段自产，
    # 不经过任何 location、后端收不到；error_page 在 server 级生效，按契约 §2 信封返回 JSON。
    # 必须用内部 URI 而不是命名 location：此时 URI 还没解析出来，跳命名 location 会报
    # “empty URI in redirect to named location” 并变成 500（实测 nginx 1.31.2）。
    # 此时还没读到请求头，request_id 是 nginx 生成的 req_$request_id。
    error_page 414 /__aia_errors/414;

    location = /__aia_errors/414 {
      internal;
      default_type "application/json; charset=utf-8";
      add_header X-Request-Id $aia_request_id always;
      add_header Cache-Control "private, no-store" always;
      return 414 '{"error":{"code":"URI_TOO_LONG","message":"请求地址过长","details":{"max_bytes":8192},"request_id":"$aia_request_id"}}';
    }

    # 494：单个请求头（含 Cookie）超过 large_client_header_buffers 单个缓冲，nginx 内部码 494、对外是 400
    # “Request Header Or Cookie Too Large”（HTML）。同样改成 JSON 信封，对外状态码保持 400。
    error_page 494 =400 @header_too_large;

    location @header_too_large {
      default_type "application/json; charset=utf-8";
      add_header X-Request-Id $aia_request_id always;
      add_header Cache-Control "private, no-store" always;
      return 400 '{"error":{"code":"REQUEST_HEADER_TOO_LARGE","message":"请求头过大","details":{"max_bytes":8192},"request_id":"$aia_request_id"}}';
    }

    # 429：nginx limit_req 自产（后端收不到），按契约 §1.3/§2 返回 RATE_LIMITED 信封 + Retry-After（秒）；
    # retry_after_s 与 Retry-After 取 $aia_retry_after_s（= ceil(1/速率)，在 limits*.conf 里与速率一起定义）。
    # 后端应用层自己的 429（T-B03a/T-B45）原样透传（未开 proxy_intercept_errors）。
    error_page 429 @rate_limited;

    location @rate_limited {
      default_type "application/json; charset=utf-8";
      add_header Retry-After $aia_retry_after_s always;
      add_header X-Request-Id $aia_request_id always;
      add_header Cache-Control "private, no-store" always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后再试","details":{"retry_after_s":$aia_retry_after_s},"request_id":"$aia_request_id"}}';
    }

    location / {
      default_type text/plain;
      return 200 "ashare-invest-assistant placeholder (frontend not built yet)\n";
    }
  }
}
