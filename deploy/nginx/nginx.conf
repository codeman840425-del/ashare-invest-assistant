# 占位配置（T-O01/T-O01a）：/healthz 由 nginx 自答（不依赖上游）+ /api 反代到 api。TLS、静态资源、SSE 透传在后续任务补全。
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  upstream api_upstream { server api:8000; }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # proxy_pass 不带 URI（无末尾斜杠）：原样转发 /api/v1/...，与后端 API_PREFIX=/api/v1 对齐（T-O01a）。
    # 之前写成 http://api_upstream/ 会把 /api/ 替换成 /，后端收到 /v1/health → 404。
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 200 "ashare-invest-assistant placeholder (frontend not built yet)\n";
    }
  }
}
