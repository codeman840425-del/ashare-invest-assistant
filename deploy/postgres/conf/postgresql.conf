# =====================================================================
# ashare-invest-assistant —— PostgreSQL 16 + TimescaleDB 运行参数（T-O08）
# 挂载为 /etc/postgresql/postgresql.conf，compose 用
#   postgres -c config_file=/etc/postgresql/postgresql.conf
# 启动；数据目录里由镜像 timescaledb-tune 生成的 postgresql.conf 不再生效
# （它按 initdb 时的宿主内存自动推算，不可复现），pg_hba.conf 仍用数据目录里的。
#
# 目标机型：plan §3A.2 / 问题 24 推荐 8C16G、SSD ≥300 GB（当前开发机 8 核 / 15 GiB / 无 swap）。
# 与 Redis、API/Worker 等同机部署，所以 PG 只按 ~2/3 内存规划：
#   shared_buffers 4 GB（plan §3A.2 结论）+ 每连接 work_mem + 维护内存。
# 改参数后：deploy/scripts/compose.sh restart postgres（带 * 的需要重启，其余 reload 即可）。
# 校验：deploy/scripts/compose.sh exec postgres psql -U aia -c 'SHOW shared_buffers'
# =====================================================================

# --- 连接 ---
listen_addresses = '*'                  # 只在 compose 网络内可达；dev 叠加层仅映射到 127.0.0.1  (*)
port = 5432                             # (*)
max_connections = 100                   # API/Worker 走 SQLAlchemy 连接池；超出时上 pgbouncer  (*)
superuser_reserved_connections = 3      # (*)
password_encryption = scram-sha-256

# --- 内存 ---
shared_buffers = 4GB                    # ≈ 25% RAM，plan §3A.2  (*)
huge_pages = try                        # (*)
effective_cache_size = 10GB             # 规划器假设：shared_buffers + OS 页缓存
work_mem = 16MB                         # 每个排序/哈希节点；100 连接 × 少量节点仍在预算内
hash_mem_multiplier = 2.0
maintenance_work_mem = 1GB              # 建索引、压缩 chunk、VACUUM
autovacuum_work_mem = 256MB             # 避免 10 个 autovacuum worker × 1GB
dynamic_shared_memory_type = posix      # 依赖容器 /dev/shm（compose 设 shm_size: 1gb）  (*)
max_locks_per_transaction = 256         # hypertable chunk 多，pg_dump 需一次锁住全部 chunk  (*)

# --- 并行 / 后台进程（8 核） ---
max_worker_processes = 27               # = 16 (timescaledb) + 8 (并行) + 3 余量  (*)
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
timescaledb.max_background_workers = 16 # 压缩/保留/连续聚合刷新等策略作业的 worker 上限  (*)

# --- WAL / 检查点 ---
wal_level = replica                     # 允许后续开启 WAL 归档 / pg_basebackup  (*)
wal_compression = lz4                   # 整页写入压缩，降低 WAL 体积
wal_buffers = 16MB                      # (*)
max_wal_size = 8GB                      # 盘中写入高峰（分钟线 + 实时快照）避免频繁强制检查点
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_warning = 5min               # 检查点间隔短于 5 分钟时写日志 = max_wal_size 偏小的信号
max_wal_senders = 5                     # (*)
wal_keep_size = 0
# WAL 归档（plan §1.1 "每日 pg_dump + WAL 归档"）：目标存储确定后再启用；需重启。
archive_mode = off                      # (*)
#archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
synchronous_commit = on

# --- 规划器（SSD） ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
jit = off                               # OLTP + 短分析查询，JIT 编译开销大于收益

# --- autovacuum（多 chunk） ---
autovacuum_max_workers = 6              # (*)
autovacuum_naptime = 10s

# --- 日志（输出到容器 stderr，docker logs 查看） ---
log_destination = 'stderr'
logging_collector = off                 # (*)
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_min_duration_statement = 1000       # 慢查询阈值 1s
log_autovacuum_min_duration = 10s
log_lock_waits = on
log_temp_files = 64MB
log_timezone = 'UTC'

# --- 本地化 / 时区（存储一律 timestamptz；展示时区在应用层转换为 Asia/Shanghai） ---
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
default_toast_compression = lz4

# --- TimescaleDB ---
shared_preload_libraries = 'timescaledb'  # (*)
timescaledb.telemetry_level = off
