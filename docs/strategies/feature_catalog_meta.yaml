# feature_catalog_meta.yaml — T-R17（依据：api-contract §7.4 T-A13 裁定，d67d2a9）
# 覆盖范围：H-01、W-01 正式卡，以及 G-01、G-02、N-01 用到的全部 f.*（共 19 个键；T-R20 为 v2 卡新增 f.market_regime_idx，共 20 个，老键不删）；null 表示研究员暂未确定（契约允许）。
# warmup_bars 指特征本身需要的历史根数，不包含卡内 ma(x,n) 等窗口。
features:
  - feature_key: f.amount
    description: "当日成交额（元）"
    dimension: "technical"
    warmup_bars: 0
    available_at: "d 盘后"
    epistemic_type: "fact"
    spec_ref: F19
  - feature_key: f.ann_risk_count_10d
    description: "近 10 个交易日命中风险关键词表的公告条数"
    dimension: "news"
    warmup_bars: 10
    available_at: "次一交易日 09:30（D−1 晚间拉取后确定，D 日 09:30 生效）"
    epistemic_type: null
    spec_ref: F23
  - feature_key: f.close_qfq
