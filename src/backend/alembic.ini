# Alembic configuration (T-B02). Keep this file ASCII-only: readers use the OS locale.
# Database URLs stay out of this file. migrations/env.py resolves them in this order:
#   1) CLI -x url=... (local debugging only; keep credential-bearing URLs out of shell history)
#   2) DATABASE_URL environment variable
#   3) app.config.Settings.database_url (environment / .env)
# postgresql:// is normalized to postgresql+psycopg:// (psycopg 3).
# From src/backend: uv run alembic upgrade head; then deploy/scripts/db-apply-timescale.sh.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
