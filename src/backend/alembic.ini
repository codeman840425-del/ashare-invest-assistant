# Alembic 配置（T-B02）。数据库 URL 不写在这里：migrations/env.py 依次取
#   1) 命令行 -x url=...（仅本地调试；注意不要把含密码的 URL 留在 shell 历史里）
#   2) 环境变量 DATABASE_URL
#   3) app.config.Settings.database_url（同样来自环境变量 / .env）
# postgresql:// 前缀会自动换成 postgresql+psycopg://（psycopg 3）。
# 用法（在 src/backend 下）：uv run alembic upgrade head；之后运行 deploy/scripts/db-apply-timescale.sh。
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
