[project]
name = "ashare-invest-assistant-backend"
version = "0.1.0"
description = "A股个人投资研究与决策助手 · 后端（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "python-multipart>=0.0.18",
    "pypinyin==0.55.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
# probes/ 是 T003 的独立探测脚本（只依赖标准库，单独维护），不纳入后端应用的 lint 门禁
extend-exclude = ["probes", "migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "C4", "PT", "ANN", "BLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文全角标点出现在文案/注释中属正常
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
