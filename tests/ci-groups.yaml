# T-T93 / T-O100 后端 CI 分组；每个模块一行，路径相对仓库根。
# 优先级 serial_pg > serial_port > serial_shared > parallel；keywords 同时保留次级风险。
# serial_pg：真实 PG（含连接失败探测）；serial_port：服务/共享端口客户端；serial_shared：共享文件或全局状态。
# parallel：纯函数、mock、内存数据库、进程内 TestClient、pytest 临时目录及自动还原 monkeypatch。
# 公共 tests/conftest.py 的 replay/DNS 防护为各进程共同基线；不等于所有文件请求 PG/Redis fixture。
# 已逐文件扫描关键词/AST、近层 conftest、导入的 fixture/helper；注释、合成 DSN、只读常量不单独判 PG。
# unverified 表示仍不确定的资源风险，必须留在串行组；false 表示静态链路已确认，不表示实际跑过集成例。
# 运维：parallel 可 xdist/分片；三个 serial_* 合并后用单 worker 顺序运行，并隔离 parallel 的 PG/端口/共享资源。
# 从仓库根按 group 过滤 file 列表，作为 env -u MAIRUI_LICENCE PYTHONPATH=src/backend python -m pytest -c tests/pytest.ini 的位置参数。
# 例如 Python yaml.safe_load(...)["tests"] 中筛选 r["group"] == "parallel" 后取 r["file"]；此组可追加 -n 4。
# 守护递归扫描 tests/backend、tests/replay 及 src/backend/tests（不含 selfchecks）。
# 全范围收集必须显式给 tests/backend tests/replay（根目录下裸跑会回退扫描范围外 scripts）；守护测试独立跑不启动嵌套收集。
# 对账命令：env -u MAIRUI_LICENCE PYTHONPATH=src/backend python -m pytest -c tests/pytest.ini tests/backend tests/replay --collect-only -q
version: 1
