# pytest 配置（T-T01）。放在 tests/ 下：从仓库根目录执行 `pytest tests/backend tests/replay` 时，
# pytest 会把 tests/ 识别为 rootdir 并读取本文件（plan §6：测试从仓库根目录执行）。
[pytest]
minversion = 8.0
testpaths = backend replay
python_files = test_*.py
addopts = -ra --strict-markers --strict-config --import-mode=importlib
xfail_strict = true
markers =
    unit: 纯函数 / 不需要外部服务
    integration: 需要 Docker 测试容器（PostgreSQL 16 + TimescaleDB、Redis 7）；Docker 不可用时自动 skip
    contract: schemathesis 契约测试
    golden: golden 快照比对
    replay: 麦蕊录制回放（只读 fixtures，绝不联网）
    import_case: 映射到 T004 导入验收用例（TC-*）
    pending_impl: 被测实现尚未落地，当前 skip
    local_tb58: Grok 2026-11-12 B1；仅 tb63 固定身份单例，GitHub-hosted runner 跳过，本地/自托管严格验真
filterwarnings =
    ignore:testcontainers.postgres is deprecated:DeprecationWarning
    ignore:testcontainers.redis is deprecated:DeprecationWarning
